name: Precompute tree audits

# Tree Health findings and Orphan Records, computed once per import by
# packages/core/scripts/precompute-audit.mts and stored for the app to read
# (migration 20260917210000). Runs every ten minutes for any tree whose audit
# is missing or older than its import; a manual run can name specific trees.
# The service-role key is fetched at run time with the same SUPABASE_ACCESS_TOKEN
# secret deploy-functions.yml uses, so nothing new is stored in GitHub.

# The schedule moved to ops-watch.yml (2026-09-18): GitHub's cron dropped
# most */10 firings, so the watcher's ten-minute loop now runs --pending.
# This workflow remains for explicit, manual runs.
on:
  workflow_dispatch:
    inputs:
      trees:
        description: 'Space-separated tree ids to audit unconditionally (blank = pending trees only)'
        required: false
        default: ''

concurrency:
  group: precompute-audit
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: bdjsahbjptpcmouqozvs
  EXPO_PUBLIC_SUPABASE_URL: https://bdjsahbjptpcmouqozvs.supabase.co

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch the service-role key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty (repository secret on bicentenial1776-rufus/Witness)."
            exit 1
          fi
          KEY=$(npx supabase@latest projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const k=JSON.parse(s).find(k=>k.name==="service_role");if(!k){console.error("no service_role key in api-keys output");process.exit(1)}process.stdout.write(k.api_key)})')
          echo "::add-mask::$KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Audit trees
        working-directory: packages/core
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.trees }}" ]; then
            npx tsx scripts/precompute-audit.mts ${{ inputs.trees }}
          else
            npx tsx scripts/precompute-audit.mts --pending
          fi
