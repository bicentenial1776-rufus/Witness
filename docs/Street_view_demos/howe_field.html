/* ══ GEOMETRY MERGING ══════════════════════════════════════════════════════
   Flat colour means very few materials, which means everything static can
   collapse into one mesh per material. 129 houses become a dozen draw calls.
   ══════════════════════════════════════════════════════════════════════════ */
function mergeGeos(list){
  var nV=0,i,g;
  for(i=0;i<list.length;i++)nV+=list[i].attributes.position.count;
  var P2=new Float32Array(nV*3),N2=new Float32Array(nV*3),o=0;
  for(i=0;i<list.length;i++){
    g=list[i];
    var pa=g.attributes.position.array,na=g.attributes.normal?g.attributes.normal.array:null;
    P2.set(pa,o*3);
    if(na)N2.set(na,o*3);
    o+=g.attributes.position.count;
    g.dispose();}
  var out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(P2,3));
  out.setAttribute('normal',new THREE.BufferAttribute(N2,3));
  return out;}
function harvest(group,bucket){
  group.updateMatrixWorld(true);
  var kill=[];
  group.traverse(function(o){
    if(!o.isMesh||!o.geometry||!o.material)return;
    if(o.material.visible===false)return;
    var key=o.material.userData&&o.material.userData.key;
    if(!key){key='_'+o.material.color.getHexString()+
      (o.material.transparent?'t':'')+(o.material.emissive?o.material.emissive.getHexString():'');
      if(!bucket._extra)bucket._extra={};
      bucket._extra[key]=o.material;}
    var g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();
    g.applyMatrix4(o.matrixWorld);
    if(!g.attributes.normal)g.computeVertexNormals();
    (bucket[key]=bucket[key]||[]).push(g);
    kill.push(o);});
  return bucket;}
function bakeBucket(bucket,parent,shadow){
  var made=0;
  Object.keys(bucket).forEach(function(k){
    if(k==='_extra')return;
    var mat=MATS[k]?MATS[k].m:(bucket._extra&&bucket._extra[k]);
    if(!mat||!bucket[k].length)return;
    var m=new THREE.Mesh(mergeGeos(bucket[k]),mat);
    m.castShadow=!!shadow;m.receiveShadow=true;
    parent.add(m);made++;});
  return made;}
function collapse(group,shadow){
  var b=harvest(group,{});
  var out=new THREE.Group();
  bakeBucket(b,out,shadow);
  return out;}

function bx(w,h,d,m,x,y,z,ry){var o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x||0,y||0,z||0);if(ry)o.rotation.y=ry;

  o.position.set(x||0,y||0,z||0);o.castShadow=true;o.receiveShadow=true;return o;}
function GG(){return new THREE.Group();}

/* Build one wall panel of length L, height H, thickness T, lying in the XY
   plane with its inner face at z=0 and its mass running to z=-T.
   Openings are [{x, w, y0, y1}] in wall-local x (centred on 0).
   The wall is emitted as solid boxes around the voids, so the hole is a real
   tunnel through the full thickness and the reveals are its own faces.      */
function wallPanel(L,H,T,ops,mat,ext){
  var g=GG();

  var cursor=-LE/2;

    g.add(bx(x1-x0,H,T,mat,(x0+x1)/2,H/2,-T/2));}
  for(var i=0;i<ops.length;i++){
    var o=ops[i],a=o.x-o.w/2,b=o.x+o.w/2;
    pier(cursor,a);
    if(o.y0>0.004)   g.add(bx(o.w,o.y0,T,mat,o.x,o.y0/2,-T/2));
    if(H-o.y1>0.004) g.add(bx(o.w,H-o.y1,T,mat,o.x,(H+o.y1)/2,-T/2));
    cursor=b;}
  pier(cursor,LE/2);
  return g;}

/* ── solids ──────────────────────────────────────────────────────────────
   Roofs are built as closed solids from explicit faces, not as rotated
   boxes that approximately meet. Nothing can gap at the ridge or the verge.
   ─────────────────────────────────────────────────────────────────────── */
function faceNormal(f){
  var nx=0,ny=0,nz=0;
  for(var i=0;i<f.length;i++){var a=f[i],b=f[(i+1)%f.length];
    nx+=(a[1]-b[1])*(a[2]+b[2]);ny+=(a[2]-b[2])*(a[0]+b[0]);nz+=(a[0]-b[0])*(a[1]+b[1]);}
  var L=Math.hypot(nx,ny,nz)||1;return [nx/L,ny/L,nz/L];}
function solid(faces,mat,ref){
  var v=[],n=[];
  faces.forEach(function(f){
    var nm=faceNormal(f),poly=f;
    if(ref){
      var cx=0,cy=0,cz=0;
      for(var i=0;i<f.length;i++){cx+=f[i][0];cy+=f[i][1];cz+=f[i][2];}
      cx/=f.length;cy/=f.length;cz/=f.length;
      if(nm[0]*(cx-ref[0])+nm[1]*(cy-ref[1])+nm[2]*(cz-ref[2])<0){
        poly=f.slice().reverse();nm=[-nm[0],-nm[1],-nm[2]];}}
    for(var t=1;t<poly.length-1;t++){
      [poly[0],poly[t],poly[t+1]].forEach(function(p){
        v.push(p[0],p[1],p[2]);n.push(nm[0],nm[1],nm[2]);});}});
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(n,3));
  var m=new THREE.Mesh(g,mat);m.castShadow=true;m.receiveShadow=true;return m;}

/* extrude a closed 2D section along X. pts are [z,y]. */
function extrudeZY(pts,x0,x1,mat){
  var area=0;
  for(var i=0;i<pts.length;i++){var a=pts[i],b=pts[(i+1)%pts.length];
    area+=a[0]*b[1]-b[0]*a[1];}
  var P=area<0?pts.slice().reverse():pts.slice();
  function V(x,p){return [x,p[1],p[0]];}
  var faces=[],n=P.length;
  faces.push(P.map(function(p){return V(x1,p);}));
  faces.push(P.slice().reverse().map(function(p){return V(x0,p);}));
  for(var j=0;j<n;j++){
    var a2=P[j],b2=P[(j+1)%n];
    faces.push([V(x0,a2),V(x0,b2),V(x1,b2),V(x1,a2)]);}
  var cx=0,cy=0;P.forEach(function(p){cx+=p[0];cy+=p[1];});
  return solid(faces,mat,[(x0+x1)/2,cy/n,cx/n]);}

/* ── roofs ────────────────────────────────────────────────────────────── */
function roofGable(FH,W,D,pitch,ov,thick,ridgeAlongX,mat){
  var span=ridgeAlongX?D:W, run=ridgeAlongX?W:D;
  var hs=span/2, rise=hs*pitch;
  var So=hs+ov, Lo=run/2+ov;
  var eaveY=FH-ov*pitch, ridgeY=FH+rise;
  var sec=[[-So,eaveY],[0,ridgeY],[So,eaveY],

  var m=extrudeZY(sec,-Lo,Lo,mat);
  var g=GG();
  if(!ridgeAlongX)m.rotation.y=Math.PI/2;
  g.add(m);
  g.userData.rise=rise;g.userData.ridgeY=ridgeY;

function roofHip(FH,W,D,pitch,ov,thick,mat){
  var Wo=W/2+ov, Do=D/2+ov;
  var eaveY=FH-ov*pitch, ridgeY=FH+(D/2)*pitch;
  var rx=Math.max(0.35,Wo-Do);
  var A=[-Wo,eaveY,-Do],B=[Wo,eaveY,-Do],C=[Wo,eaveY,Do],E=[-Wo,eaveY,Do];
  var R1=[-rx,ridgeY,0],R2=[rx,ridgeY,0];
  function dn(p){return [p[0],p[1]-thick,p[2]];}
  var A2=dn(A),B2=dn(B),C2=dn(C),E2=dn(E),R1b=dn(R1),R2b=dn(R2);
  var faces=[
    [A,B,R2,R1],[C,E,R1,R2],[B,C,R2],[E,A,R1],
    [A2,B2,R2b,R1b],[C2,E2,R1b,R2b],[B2,C2,R2b],[E2,A2,R1b],
    [A,B,B2,A2],[B,C,C2,B2],[C,E,E2,C2],[E,A,A2,E2]];

  g.add(solid(faces,mat,[0,(ridgeY+eaveY)/2-thick*0.5,0]));

/* ── the shell ───────────────────────────────────────────────────────────
   walls: N(-z) E(+x) S(+z) W(-x). u runs 0..1 along +x for N and S,
   along +z for W and E. Every object is authored facing +Z, so the rotation
   that puts its back to a wall is a constant per wall.                     */
var WALLROT={N:0,S:Math.PI,W:Math.PI/2,E:-Math.PI/2};
function wallAxis(k,R){return (k==='N'||k==='S')?R.w:R.d;}
function onWall(k,u,off,R){
  var L=wallAxis(k,R),a=(u-0.5)*L;
  if(k==='N')return{x:a,z:-R.d/2+off,ry:0};
  if(k==='S')return{x:a,z: R.d/2-off,ry:Math.PI};
  if(k==='W')return{x:-R.w/2+off,z:a,ry:Math.PI/2};
  return{x:R.w/2-off,z:a,ry:-Math.PI/2};}

function buildShell(R,A,MATS_){

      g.add(bx(pw,0.05,R.d,A.floor,px,0.025,0));}
  } else {
    var f=new THREE.Mesh(new THREE.PlaneGeometry(R.w,R.d),A.floor);
    f.rotation.x=-Math.PI/2;f.receiveShadow=true;g.add(f);}
  /* four walls, each with its own voids */
  var apertures=[];
  ['N','E','S','W'].forEach(function(k){
    var L=wallAxis(k,R);
    var ops=(A.openings||[]).filter(function(o){return o.wall===k;}).map(function(o){
      return {x:(o.u-0.5)*L,w:o.w,y0:o.y0,y1:o.y1,src:o};});
    var wp=wallPanel(L,H,T,ops,A.wall,(k==='N'||k==='S')?T:0);
    var pos=onWall(k,0.5,0,R);
    wp.position.set(pos.x,0,pos.z);wp.rotation.y=pos.ry;
    g.add(wp);
    ops.forEach(function(o){
      var fitted = o.src.type==='door'
        ? fitDoor(o,T,A.mats,o.src.opt)
        : fitWindow(o,T,A.mats,o.src.opt);
      var p2=onWall(k,o.src.u,0,R);
      fitted.position.set(p2.x,0,p2.z);fitted.rotation.y=p2.ry;
      g.add(fitted);
      apertures.push({wall:k,u:o.src.u,type:o.src.type,x:p2.x,z:p2.z,ry:p2.ry,
                      y0:o.y0,y1:o.y1,w:o.w,tag:o.src.tag});});
    if(A.dado) g.add((function(){
      var dg=bx(L,A.dado,0.016,A.dadoMat,pos.x,A.dado/2,pos.z);
      dg.rotation.y=pos.ry;
      var q=onWall(k,0.5,0.009,R);dg.position.set(q.x,A.dado/2,q.z);return dg;})());
    if(A.rail) g.add((function(){
      var q=onWall(k,0.5,0.03,R);
      var rg2=bx(L,0.06,0.05,A.railMat,q.x,A.rail,q.z);rg2.rotation.y=pos.ry;return rg2;})());
    if(A.skirt) g.add((function(){
      var q=onWall(k,0.5,0.014,R);
      var sg=bx(L,A.skirt,0.028,A.skirtMat,q.x,A.skirt/2,q.z);sg.rotation.y=pos.ry;return sg;})());
  });
  /* ceiling */
  var deck=new THREE.Mesh(new THREE.PlaneGeometry(R.w,R.d),A.deck||A.wall);
  deck.rotation.x=Math.PI/2;deck.position.y=H;deck.receiveShadow=true;g.add(deck);
  if(A.beams){
    var bn=A.beams,along=A.beamAxis==='x';
    for(var b=0;b<bn;b++){
      var t2=-(along?R.d:R.w)/2+(along?R.d:R.w)*(b+0.5)/bn;
      var bm;
      if(A.beamRound){bm=cy(A.beamR||0.085,A.beamR||0.085,along?R.w:R.d,9,A.beamMat,0,H-(A.beamR||0.085)-0.01,0);
        bm.rotation.z=Math.PI/2;if(!along)bm.rotation.y=Math.PI/2;}
      else bm=bx(along?R.w:0.16,0.16,along?0.16:R.d,A.beamMat,0,H-0.08,0);
      if(along)bm.position.set(0,H-(A.beamRound?(A.beamR||0.085)+0.01:0.08),t2);
      else bm.position.set(t2,H-(A.beamRound?(A.beamR||0.085)+0.01:0.08),0);
      g.add(bm);}
    if(A.summer) g.add(bx(0.28,0.30,R.d,A.beamMat,0,H-0.16,0));}
  if(A.cornice)for(var ci=0;ci<4;ci++){
    var k2=['N','E','S','W'][ci],q3=onWall(k2,0.5,0.05,R);
    var cg=bx(wallAxis(k2,R),0.09,0.09,A.cornMat||A.beamMat,q3.x,H-0.05,q3.z);
    cg.rotation.y=WALLROT[k2];g.add(cg);}
  return {group:g,apertures:apertures};}

/* ══════════════════════════════════════════════════════════════════════════
   LAYOUT
   Placement is composed, not searched. Every piece names the wall it stands
   against or the piece it serves; its rotation is derived from that, never
   drawn from a hat. What varies with the record is counts, not positions.
   ══════════════════════════════════════════════════════════════════════════ */
function faceTo(x,z,tx,tz){return Math.atan2(tx-x,tz-z);}
function obb(x,z,w,d,ry){
  var c=Math.cos(ry),s=Math.sin(ry);
  return {c:[x,z],ax:[[c,-s],[s,c]],e:[w/2,d/2]};}
function obbHit(A,B){
  var dx=B.c[0]-A.c[0],dz=B.c[1]-A.c[1];
  var axes=[A.ax[0],A.ax[1],B.ax[0],B.ax[1]];
  for(var i=0;i<4;i++){
    var ax=axes[i];
    var pa=Math.abs(A.ax[0][0]*ax[0]+A.ax[0][1]*ax[1])*A.e[0]+
           Math.abs(A.ax[1][0]*ax[0]+A.ax[1][1]*ax[1])*A.e[1];
    var pb=Math.abs(B.ax[0][0]*ax[0]+B.ax[0][1]*ax[1])*B.e[0]+
           Math.abs(B.ax[1][0]*ax[0]+B.ax[1][1]*ax[1])*B.e[1];
    if(Math.abs(dx*ax[0]+dz*ax[1])>pa+pb-0.005)return false;}
  return true;}

function layout(prof,ctx){
  var R=prof.room,out=[],by={},rg=mulberry32(hashStr(ctx.key));
  var items=prof.items;
  for(var i=0;i<items.length;i++){
    var s=items[i];
    if(s.needTrade&&!ctx.trade)continue;
    if(s.thin&&ctx.band==='partial')continue;
    var fdef=F[s.form];if(!fdef)continue;
    var fp=s.fp||fdef.fp,A=s.at;
    var made=[];

    if(A.wall){
      var back=(s.flat?0.012:fp[1]/2+0.018);
      var pos=onWall(A.wall,A.u,back,R);
      made.push({x:pos.x,z:pos.z,ry:pos.ry,y:0});}
    else if(A.hang){
      var hp=onWall(A.hang,A.u,0.03,R);
      made.push({x:hp.x,z:hp.z,ry:hp.ry,y:A.y});}
    else if(A.xz){
      var ry=A.ry!==undefined?A.ry:0;
      made.push({x:A.xz[0],z:A.xz[1],ry:ry,y:A.y||0,noclip:!!A.y});}
    else if(A.on){
      var pt=by[A.on];if(!pt)continue;
      var c=Math.cos(pt.ry),sn=Math.sin(pt.ry);
      var ox=(A.dx||0)*c+(A.dz||0)*sn, oz=-(A.dx||0)*sn+(A.dz||0)*c;
      made.push({x:pt.x+ox,z:pt.z+oz,ry:pt.ry+(A.turn||0),
                 y:A.y!==undefined?A.y:(pt.topY||0.75),noclip:true});}
    else if(A.around){
      var p2=by[A.around];if(!p2)continue;
      var n=A.n==='children'?Math.max(1,Math.min(4,ctx.children||1)):(A.n||2);
      var arc=A.arc||[0,Math.PI*2],gap=A.gap===undefined?0.02:A.gap;
      var rad=Math.sqrt(fp[0]*fp[0]+fp[1]*fp[1])/2;
      var hw=p2.fp[0]/2+rad+gap, hd=p2.fp[1]/2+rad+gap;
      for(var k=0;k<n;k++){
        var t=n===1?0.5:k/(n-1);
        var a=arc[0]+(arc[1]-arc[0])*t;
        var sa2=Math.sin(a),ca2=Math.cos(a);
        var tx=Math.abs(sa2)<1e-5?1e9:hw/Math.abs(sa2);
        var tz=Math.abs(ca2)<1e-5?1e9:hd/Math.abs(ca2);
        var rr2=Math.min(tx,tz);
        var lx=sa2*rr2, lz=ca2*rr2;
        var cc=Math.cos(p2.ry),ss=Math.sin(p2.ry);
        var ax2=p2.x+lx*cc+lz*ss, az2=p2.z-lx*ss+lz*cc;
        made.push({x:ax2,z:az2,ry:faceTo(ax2,az2,p2.x,p2.z)});}}
    else continue;

    for(var m=0;m<made.length;m++){
      var q=made[m];
      if(s.jitter!==false&&!q.noclip)q.ry+=(rg()-0.5)*0.035;
      var rec={id:s.id+(m?'_'+m:''),form:s.form,p:s.p,mat:s.mat,
        x:q.x,y:q.y||0,z:q.z,ry:q.ry,fp:fp,noclip:q.noclip||s.flat,
        n:s.n,nat:s.nat,d:s.d,t:s.t,topY:(q.y||0)+(s.topY||fdef.top||0)};
      out.push(rec);
      if(m===0)by[s.id]=rec;}
  }
  return out;}

function auditRoom(prof,ctx){
  var R=prof.room,items=layout(prof,ctx),bad=[];
  for(var i=0;i<items.length;i++){
    var a=items[i];if(a.noclip)continue;
    var ca=Math.abs(Math.cos(a.ry)),sa=Math.abs(Math.sin(a.ry));
    var ex=a.fp[0]/2*ca+a.fp[1]/2*sa, ez=a.fp[0]/2*sa+a.fp[1]/2*ca;
    if(Math.abs(a.x)+ex>R.w/2+0.02||Math.abs(a.z)+ez>R.d/2+0.02)
      bad.push(['outside',a.id,(Math.abs(a.x)+ex-R.w/2).toFixed(2)+'/'+
                               (Math.abs(a.z)+ez-R.d/2).toFixed(2)]);
    for(var j=i+1;j<items.length;j++){
      var b=items[j];if(b.noclip)continue;
      if(obbHit(obb(a.x,a.z,a.fp[0],a.fp[1],a.ry),obb(b.x,b.z,b.fp[0],b.fp[1],b.ry)))
        bad.push(['overlap',a.id,b.id]);}}
  /* a door must open into clear floor */
  (prof.arch.openings||[]).forEach(function(o){
    if(o.type!=='door')return;
    var p=onWall(o.wall,o.u,0.9,R);
    for(var k=0;k<items.length;k++){var it=items[k];if(it.noclip)continue;
      if(obbHit(obb(p.x,p.z,1.3,1.5,WALLROT[o.wall]),
                obb(it.x,it.z,it.fp[0],it.fp[1],it.ry)))bad.push(['blocks door',it.id]);}});
  return {items:items,bad:bad};}

   THE ROOM
   Shell, then contents, then air. The air is derived: light comes from
   whatever heat and lamps the plan contains, and the shaft comes from

function softDot(){var c=document.createElement('canvas');c.width=c.height=64;

  gr.addColorStop(1,'rgba(255,245,225,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);

function beamTexture(){var c=document.createElement('canvas');c.width=c.height=128;
  var g=c.getContext('2d');

    c.traverse&&c.traverse(function(o){if(o.geometry&&o.geometry.dispose)o.geometry.dispose();});}

    dat.push({vx:(rnd()-0.5)*0.00014,vy:0.00018+rnd()*0.00046,vz:(rnd()-0.5)*0.00014,
              ph:rnd()*6.3,home:p});}

  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var pts=new THREE.Points(g,new THREE.PointsMaterial({map:DOT,color:col,size:size,
    transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending,
    sizeAttenuation:true}));

  g.traverse(function(o){if(o.isMesh){o.material=o.material.clone();
    o.userData.em=o.material.emissive?o.material.emissive.getHex():0;}});

function buildRoom(h){

        for(var lg=0;lg<5;lg++){
          var log=cy(0.05,0.062,0.55+rnd()*0.25,7,M('wood_dark'),
            fx+(rnd()-0.5)*0.7*c,0.14,fz-(rnd()-0.5)*0.5*sn);
          log.rotation.z=Math.PI/2*(0.85+rnd()*0.3);log.rotation.y=s.ry+rnd()*0.6;
          roomGroup.add(log);}
        for(var f2=0;f2<5;f2++){
          var fm=new THREE.Mesh(new THREE.ConeGeometry(0.10+rnd()*0.055,0.34+rnd()*0.22,9),
            new THREE.MeshStandardMaterial({color:0xffb44f,emissive:0xff8c1c,
              emissiveIntensity:3.1,transparent:true,opacity:0.44,depthWrite:false}));
          fm.position.set(fx+(f2-2)*0.15*c,0.30,fz-(f2-2)*0.15*sn);
          roomGroup.add(fm);roomFlames.push({m:fm,p:rnd()*6.3});}
        motes(190,function(){return [fx+(rnd()-0.5)*1.1,0.2+rnd()*1.5,fz+(rnd()-0.5)*0.8];},
          0.025,0.26,0xffb072,2.3);}}

  });

  var hemi=new THREE.HemisphereLight(0x3c536e,0x2c2216,0.42);roomGroup.add(hemi);

/* ══════════════════════════════════════════════════════════════════════════
   THE SITE
   1,829 households from a real file. Radius is time: the earliest known are
   at the centre, the living at the rim. Because a pedigree is far denser in
   the seventeenth century than in the twentieth, radius is assigned by equal
   area rather than linearly, so the density on the ground stays even and no
   generation is crushed into a thin ring.
   ══════════════════════════════════════════════════════════════════════════ */
var R0=46, RMAX=780;
var ORDER=HOUSES.slice().sort(function(a,b){
  return a.year-b.year || a.i-b.i;});
var RSTEP=(RMAX*RMAX-R0*R0)/Math.max(1,ORDER.length);
ORDER.forEach(function(h,k){h.rank=k;h.r0=Math.sqrt(R0*R0+k*RSTEP);});
var RTAB=[];
for(var q=0;q<=60;q++){
  var k=Math.min(ORDER.length-1,Math.round(q/60*(ORDER.length-1)));
  RTAB.push([ORDER[k].r0,ORDER[k].year]);}
function yearAtR(r){
  if(r<=RTAB[0][0])return RTAB[0][1];
  for(var i=1;i<RTAB.length;i++){
    if(r<=RTAB[i][0]){
      var t=(r-RTAB[i-1][0])/((RTAB[i][0]-RTAB[i-1][0])||1);
      return RTAB[i-1][1]+(RTAB[i][1]-RTAB[i-1][1])*t;}}
  return RTAB[RTAB.length-1][1];}


/* ── the ground ───────────────────────────────────────────────────────────
   A shallow bowl: a level plaza at the middle holding the stones, rising
   gently outward into low hills. About fifty metres of relief across seven
   hundred and eighty — a six per cent grade, landscape rather than terrain.
   ─────────────────────────────────────────────────────────────────────── */
var PLAZA_R=38, PLAZA_BLEND=44, PLAZA_Y=0;
var HILL_R=790, HILL_A=13.0, HILL_S=52000;
var BOWL_A=33.0, BOWL_IN=64, BOWL_OUT=800;
var STONE_R=17;
var HILLS=null, STONES=null;
function smoothTo(e0,e1,x){
  var t=Math.max(0,Math.min(1,(x-e0)/(e1-e0)));return t*t*(3-2*t);}
function initLandmarks(){
  HILLS=MAJOR.slice(0,3).map(function(k,i){
    var b=(LINEBEARING[k]!==undefined?LINEBEARING[k]:i/3*6.283);
    return {k:k,b:b,x:Math.cos(b)*HILL_R,z:Math.sin(b)*HILL_R};});
  STONES=MAJOR.slice(0,3).map(function(k,i){
    var b=(LINEBEARING[k]!==undefined?LINEBEARING[k]:i/3*6.283);
    return {k:k,b:b,x:Math.cos(b)*STONE_R,z:Math.sin(b)*STONE_R};});}
function naturalY(x,z){
  var r=Math.hypot(x,z);
  var g=BOWL_A*smoothTo(BOWL_IN,BOWL_OUT,r);
  if(HILLS)for(var i=0;i<3;i++){var H=HILLS[i],dx=x-H.x,dz=z-H.z;
    g+=HILL_A*Math.exp(-(dx*dx+dz*dz)/HILL_S);}
  var n=(fbm(x*0.0022+31,z*0.0022+17,4,5)-0.5)*5.4
       +(fbm(x*0.009+7,z*0.009+29,3,11)-0.5)*1.6;
  g+=n*smoothTo(PLAZA_R+10,PLAZA_R+96,r);
  var pl=1-smoothTo(PLAZA_R,PLAZA_R+PLAZA_BLEND,r);
  return g*(1-pl)+PLAZA_Y*pl;}

/* ── the grading model ───────────────────────────────────────────────── */
var PADS=[],CORR=[],GRID=40,HASH={},CHASH={};
function hkey(x,z){return Math.floor(x/GRID)+','+Math.floor(z/GRID);}
function hput(H,x,z,o){var k=hkey(x,z);(H[k]=H[k]||[]).push(o);}
function hnear(H,x,z){
  var out=[],ix=Math.floor(x/GRID),iz=Math.floor(z/GRID);
  for(var a=-1;a<=1;a++)for(var b=-1;b<=1;b++){
    var l=H[(ix+a)+','+(iz+b)];if(l)for(var i=0;i<l.length;i++)out.push(l[i]);}
  return out;}
function cellSpan(H,x0,x1,z0,z1,o){
  var i0=Math.floor(x0/GRID),i1=Math.floor(x1/GRID);
  var j0=Math.floor(z0/GRID),j1=Math.floor(z1/GRID);
  for(var i=i0;i<=i1;i++)for(var j=j0;j<=j1;j++){
    var k=i+','+j;(H[k]=H[k]||[]).push(o);}}
function registerPad(p){
  PADS.push(p);
  var R=Math.hypot(p.hw,p.hd)+p.batter+2;
  cellSpan(HASH,p.x-R,p.x+R,p.z-R,p.z+R,p);}
function padDist(p,x,z){
  /* inverse of  world = centre + u*(cos,-sin) + v*(sin,cos)  */
  var dx=x-p.x,dz=z-p.z,c=Math.cos(p.ry),s=Math.sin(p.ry);
  var u=dx*c-dz*s, v=dx*s+dz*c;
  var du=Math.abs(u)-p.hw, dv=Math.abs(v)-p.hd;
  if(du<=0&&dv<=0)return Math.max(du,dv);
  return Math.hypot(Math.max(du,0),Math.max(dv,0));}
function segDist(c,x,z){
  var vx=c.bx-c.ax,vz=c.bz-c.az,L2=vx*vx+vz*vz;
  var t=L2>0?((x-c.ax)*vx+(z-c.az)*vz)/L2:0;
  t=Math.max(0,Math.min(1,t));
  var px=c.ax+vx*t,pz=c.az+vz*t;
  return {d:Math.hypot(x-px,z-pz),y:c.ay+(c.by-c.ay)*t};}
function registerCorr(c){
  CORR.push(c);
  var R=c.half+c.batter+1;
  cellSpan(CHASH,Math.min(c.ax,c.bx)-R,Math.max(c.ax,c.bx)+R,
                 Math.min(c.az,c.bz)-R,Math.max(c.az,c.bz)+R,c);}
function smoothstep(t){return t*t*(3-2*t);}

function groundY(x,z){
  var y=naturalY(x,z);
  var pads=hnear(HASH,x,z),bestW=0,bestY=y,bestD=1e9;
  for(var i=0;i<pads.length;i++){
    var p=pads[i],d=padDist(p,x,z);
    if(d>=p.batter)continue;
    if(d<bestD){bestD=d;bestY=p.y;bestW=d<=0?1:1-smoothstep(d/p.batter);}}
  if(bestW>0)y=y*(1-bestW)+bestY*bestW;
  if(bestW>0.995)return y;              /* inside a pad the floor level is final */
  var cs=hnear(CHASH,x,z),cw=0,cy2=y;
  for(var j=0;j<cs.length;j++){
    var c=cs[j],r=segDist(c,x,z);
    if(r.d>=c.half+c.batter)continue;
    var w2=r.d<=c.half?1:1-smoothstep((r.d-c.half)/c.batter);
    if(w2>cw){cw=w2;cy2=r.y;}}
  cw*=(1-bestW);                        /* and it yields to the pad at the edges */
  if(cw>0)y=y*(1-cw)+cy2*cw;
  return y;}

   LAYOUT
   Bearing comes from the paternal surname — the thing a genealogy actually

(function layoutPlots(){

    h.plotR=Math.hypot(w/2+2.3,d/2+2.5)+1.7;});

    E('era').style.opacity='0';E('gedb').style.opacity='0';elFly.style.opacity='0';
    var pt=E('plate');
    pt.querySelector('.t').textContent=h.hn+(h.wn&&h.wn!=='—'?' & '+h.wn:'');
    pt.querySelector('.s').textContent=(h.place||'place unrecorded')+' · '+h.T;
    pt.querySelector('.k').innerHTML=
      (h.md?'married '+h.md+'<br>':'')+
      h.children+' children at home of '+h.nkids+' recorded<br>'+
      Math.round(h.score*100)+'% documented · '+h.sources+' source citations';
    setTimeout(function(){elCard.classList.remove('on');},420);},520);}
function leave(){
  elCard.classList.add('on');
  setTimeout(function(){
    mode='world';roomGroup.visible=false;cityGroup.visible=true;
    SKY.visible=true;sunL.visible=true;hemiL.visible=true;ambL.visible=true;
    clearRoom();applyAtmo();cur=null;near=null;
    E('back').style.opacity='0';E('ret').style.opacity='0';
    elTag.classList.remove('on');E('era').style.opacity='1';E('gedb').style.opacity='1';
    if(fly)elFly.style.opacity='1';
    var pt=E('plate');
    pt.querySelector('.t').textContent='Howe / Field';
    pt.querySelector('.s').textContent=HOUSES.length+' households · 5,495 people · 1 file';
    pt.querySelector('.k').innerHTML='WASD walk · shift run · E enter<br>TAB fly · space / C up down · [ ] time of day';
    setTimeout(function(){elCard.classList.remove('on');},420);},520);}

var t0=0,last=performance.now();
function loop(){
  requestAnimationFrame(loop);
  var now=performance.now(),dt=Math.min(0.05,(now-last)/1000);last=now;t0+=dt;
  if(mode==='world')stepWorld(dt);
  else{
    camera.position.set(RP.x,1.56,RP.z);
    camera.rotation.set(0,0,0);camera.rotateY(ryaw);camera.rotateX(rpitch);
    var sp=(keys.ShiftLeft?2.0:1.1)*dt,f=0,s=0;
    if(keys.KeyW)f+=1;if(keys.KeyS)f-=1;if(keys.KeyA)s-=1;if(keys.KeyD)s+=1;
    if(f||s){var L=Math.hypot(f,s);f/=L;s/=L;
      var fx=-Math.sin(ryaw),fz=-Math.cos(ryaw);
      RP.x+=(fx*f+(-fz)*s)*sp;RP.z+=(fz*f+fx*s)*sp;clampRoom();}
    stepRoomAir(t0);pickRoom();placeTag();}
  renderer.render(scene,camera);}
window.addEventListener('resize',function(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});

E('bootmsg').textContent='reading 1,852 families…';
var STATS=buildWorld();applyAtmo();
pl.x=Math.cos(0.6)*150;pl.z=Math.sin(0.6)*150;
pl.yaw=Math.atan2(-pl.x,-pl.z)+Math.PI;
var pt0=E('plate');
pt0.querySelector('.t').textContent='Howe / Field';
pt0.querySelector('.s').textContent=HOUSES.length+' households · 5,495 people · 1 file';
pt0.querySelector('.k').innerHTML='WASD walk · shift run · E enter<br>TAB fly · space / C up down · [ ] time of day';
loop();
setTimeout(function(){var b=E('boot');b.style.opacity='0';
  setTimeout(function(){b.style.display='none';},1900);
  E('plate').style.opacity='1';E('key').style.opacity='1';E('era').style.opacity='1';
  E('hint').style.opacity='1';setTimeout(function(){E('hint').style.opacity='0';},9000);},900);
/* the legend names the lines actually in this file */
(function(){
  var el=document.getElementById('lines');if(!el)return;
  var html='';
  MAJOR.slice(0,5).forEach(function(k){
    var c=lineColour(k);
    var hex='#'+[c[0],c[1],c[2]].map(function(v){
      var s=Math.round(v*255).toString(16);return s.length<2?'0'+s:s;}).join('');
    html+='<div>'+k+' <i style="background:'+hex+'"></i></div>';});
  el.innerHTML=html;})();
</script>
